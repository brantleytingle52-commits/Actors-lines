<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>No One Came Back Voice Portal</title>

<style>
*{box-sizing:border-box}
:root{
  --bg:#080a0d;
  --panel:#111419;
  --panel2:#171b21;
  --border:#2b313a;
  --text:#f2f0eb;
  --muted:#858c96;
  --red:#ce3f3f;
}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  background:
    radial-gradient(circle at 50% 20%,#261416 0,transparent 34rem),
    linear-gradient(145deg,#14181d,#07090b 65%);
  font-family:Arial,Helvetica,sans-serif;
}
button,input,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.login-screen{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:24px;
}
.login-card{
  width:min(100%,460px);
  padding:42px;
  border:1px solid var(--border);
  border-radius:18px;
  background:rgba(15,18,22,.96);
  box-shadow:0 35px 100px #000a;
}
.logo{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:44px;
  font-size:13px;
  font-weight:900;
  letter-spacing:3px;
}
.signal{
  display:flex;
  align-items:flex-end;
  gap:3px;
  height:28px;
}
.signal i{
  display:block;
  width:4px;
  border-radius:4px 4px 0 0;
  background:var(--red);
  box-shadow:0 0 12px #ce3f3f88;
}
.signal i:nth-child(1){height:30%}
.signal i:nth-child(2){height:65%}
.signal i:nth-child(3){height:100%}
.signal i:nth-child(4){height:52%}

.status{
  color:#a0a6af;
  font:700 11px "Courier New",monospace;
  letter-spacing:2px;
}
.status b{color:var(--red)}
h1{
  margin:15px 0 10px;
  font-size:48px;
  line-height:1;
  letter-spacing:-2px;
}
.login-card>p{
  color:var(--muted);
  line-height:1.6;
}
.code-label{
  display:block;
  margin:28px 0 8px;
  font-size:13px;
  font-weight:700;
}
#codeInput{
  width:100%;
  height:58px;
  padding:0 18px;
  border:1px solid #363d47;
  border-radius:9px;
  outline:none;
  background:#080a0d;
  color:white;
  font:700 20px "Courier New",monospace;
  letter-spacing:5px;
}
#codeInput:focus{
  border-color:var(--red);
  box-shadow:0 0 0 3px #ce3f3f22;
}
.login-button,.save-button{
  width:100%;
  margin-top:14px;
  padding:16px;
  border:0;
  border-radius:9px;
  background:#eeeae2;
  color:#0a0c0f;
  font-weight:900;
}
.login-button:hover,.save-button:hover{background:white}
.error{
  min-height:20px;
  color:#ff7777!important;
  font-size:13px;
}

.header{
  position:sticky;
  top:0;
  z-index:10;
  min-height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  padding:12px 34px;
  border-bottom:1px solid var(--border);
  background:#090b0eee;
  backdrop-filter:blur(15px);
}
.header-title{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:13px;
  font-weight:900;
  letter-spacing:2px;
}
.header-title small{
  display:block;
  margin-top:5px;
  color:#707781;
  font-size:9px;
}
.header-actions{
  display:flex;
  align-items:center;
  gap:12px;
}
.access-badge{
  padding:8px 12px;
  border:1px solid #383f49;
  border-radius:99px;
  color:#aaa;
  font:700 10px "Courier New",monospace;
  letter-spacing:1px;
}
.owner-badge{
  border-color:#9b3535;
  color:#ef7777;
}
.logout{
  padding:9px 12px;
  border:0;
  background:transparent;
  color:#999;
}
.logout:hover{color:white}

.dashboard{
  display:grid;
  grid-template-columns:260px 1fr;
  min-height:calc(100vh - 76px);
}
.sidebar{
  padding:28px 14px;
  border-right:1px solid var(--border);
  background:#0b0d10;
}
.sidebar-title{
  margin:0 10px 16px;
  color:#787f89;
  font:700 11px "Courier New",monospace;
  letter-spacing:2px;
}
.actor-button{
  width:100%;
  display:grid;
  grid-template-columns:32px 1fr auto;
  gap:9px;
  align-items:center;
  margin-bottom:5px;
  padding:13px 12px;
  border:1px solid transparent;
  border-radius:8px;
  background:transparent;
  color:#858c96;
  text-align:left;
}
.actor-button:hover{background:#15191e;color:white}
.actor-button.active{
  border-color:#353c46;
  background:#1a1e24;
  color:white;
  box-shadow:3px 0 var(--red) inset;
}
.actor-number{
  font:700 11px "Courier New",monospace;
}
.actor-count{
  padding:4px 7px;
  border-radius:99px;
  background:#0a0c0f;
  font:700 10px "Courier New",monospace;
}

.content{
  width:100%;
  max-width:1050px;
  margin:auto;
  padding:60px 50px 100px;
}
.content-heading{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:20px;
  margin-bottom:55px;
}
.eyebrow{
  margin:0 0 10px;
  color:var(--red);
  font:700 11px "Courier New",monospace;
  letter-spacing:2px;
}
.content-heading h2{
  margin:0;
  font-size:clamp(34px,5vw,60px);
  letter-spacing:-3px;
}
.line-summary{
  margin:10px 0 0;
  color:var(--muted);
}
.save-button{
  width:auto;
  min-width:145px;
  margin:0;
}

.scene{margin-bottom:55px}
.scene-heading{
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:15px;
}
.scene-number{
  width:58px;
  height:58px;
  display:grid;
  place-items:center;
  border:1px solid #343b45;
  background:#12151a;
  color:#747b85;
  font:700 16px "Courier New",monospace;
}
.scene-heading small{
  color:#737a84;
  font:700 10px "Courier New",monospace;
  letter-spacing:2px;
}
.scene-heading h3{
  margin:4px 0 0;
  font-size:21px;
}
.line-card{
  margin-bottom:11px;
  padding:19px;
  border:1px solid var(--border);
  border-radius:10px;
  background:linear-gradient(145deg,#13171c,#0d1014);
}
.line-card.changed{border-color:var(--red)}
.line-id{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
  color:var(--red);
  font:700 11px "Courier New",monospace;
  letter-spacing:1px;
}
.line-id span:last-child{color:#777e88}
.line-text{
  margin:0;
  color:#f1efe9;
  font-size:18px;
  line-height:1.55;
}
.line-editor{
  width:100%;
  min-height:86px;
  padding:13px;
  resize:vertical;
  border:1px solid #363d47;
  border-radius:8px;
  outline:none;
  background:#080a0d;
  color:white;
  line-height:1.5;
}
.line-editor:focus{border-color:var(--red)}
.location{
  margin:12px 0 0;
  color:#69707a;
  font-size:12px;
}
.saved-message{
  color:#8fd49a;
  font-size:13px;
  text-align:right;
}

@media(max-width:760px){
  .login-card{padding:30px 24px}
  h1{font-size:40px}
  .header{padding:12px 16px}
  .header-title small{display:none}
  .dashboard{display:block}
  .sidebar{
    position:sticky;
    top:76px;
    z-index:5;
    display:flex;
    gap:7px;
    overflow-x:auto;
    padding:10px;
    border-right:0;
    border-bottom:1px solid var(--border);
  }
  .sidebar-title{display:none}
  .actor-button{
    min-width:145px;
    margin:0;
  }
  .content{padding:38px 18px 80px}
  .content-heading{
    align-items:flex-start;
    flex-direction:column;
  }
  .save-button{width:100%}
  .content-heading h2{letter-spacing:-2px}
}
</style>
</head>

<body>

<section id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="logo">
      <span class="signal">
        <i></i><i></i><i></i><i></i>
      </span>
      NO ONE CAME BACK
    </div>

    <div class="status"><b>●</b> CAST ACCESS</div>
    <h1>Enter your code</h1>
    <p>Your code opens only the lines assigned to your character.</p>

    <form id="loginForm">
      <label class="code-label" for="codeInput">Private access code</label>
      <input
        id="codeInput"
        inputmode="numeric"
        maxlength="11"
        placeholder="•••••••••"
        autocomplete="off"
      >
      <p id="loginError" class="error"></p>
      <button class="login-button" type="submit">Open my script →</button>
    </form>
  </div>
</section>

<section id="portal" class="hidden">
  <header class="header">
    <div class="header-title">
      <span class="signal">
        <i></i><i></i><i></i><i></i>
      </span>
      <div>
        NO ONE CAME BACK
        <small>DEMO VOICE SCRIPT</small>
      </div>
    </div>

    <div class="header-actions">
      <span id="accessBadge" class="access-badge"></span>
      <button id="logoutButton" class="logout">Log out</button>
    </div>
  </header>

  <div class="dashboard">
    <aside id="sidebar" class="sidebar"></aside>

    <main class="content">
      <div class="content-heading">
        <div>
          <p id="viewType" class="eyebrow"></p>
          <h2 id="characterHeading"></h2>
          <p id="lineSummary" class="line-summary"></p>
        </div>

        <button id="saveButton" class="save-button hidden">
          Save changes
        </button>
      </div>

      <p id="savedMessage" class="saved-message"></p>
      <div id="scriptContainer"></div>
    </main>
  </div>
</section>

<script>
const characters = {
  maya:    {name:"Maya", code:"251952046"},
  eli:     {name:"Eli", code:"538428428"},
  samira:  {name:"Samira Vale", code:"5385195384"},
  grant:   {name:"Grant Mercer", code:"5384195494"},
  ruth:    {name:"Ruth Bell", code:"9471054705"},
  theo:    {name:"Theo Marsh", code:"5395195493"},
  chen:    {name:"Dr. Iris Chen", code:"71054051991"},
  sheriff: {name:"Sheriff Daniel Cross", code:"61054951919"}
};

const ownerCode = "8244828595";

const scenes = {
  1:["The Final Broadcast","Town emergency station"],
  2:["Maya Returns","South road into Saint Hollow"],
  3:["The Stranger on Main Street","Outside the sheriff station"],
  4:["The Sheriff Station","Front office and radio room"],
  5:["The Clinic Recording","Saint Hollow Clinic"],
  6:["Voices Left Behind","Maya's house and Eli's rented room"],
  7:["The North Woods","North trail marker and ranger shelter"],
  8:["The Church Radio","Saint Hollow Church"]
};

const lines = [
["sheriff",1,"SHR-001","This is Sheriff Daniel Cross. The time is twelve seventeen in the morning."],
["sheriff",1,"SHR-002","If you can hear me, do not follow the evacuation signal."],
["sheriff",1,"SHR-003","The voice on the radio is not one of us."],
["sheriff",1,"SHR-004","Stay out of the North Woods. Stay away from anything that calls your name."],

["maya",2,"MAY-001","Same road. Same houses. Just no people."],
["maya",2,"MAY-002","Samira, if you came back here, you better have left me something."],
["maya",2,"MAY-003","No signal. Of course."],
["maya",2,"MAY-004","That light was not on a second ago."],
["samira",2,"SAM-001","Maya, do not come looking for me."],
["samira",2,"SAM-002","If the town is quiet, keep it that way."],

["maya",3,"MAY-005","Stop right there."],
["eli",3,"ELI-001","Easy. I am not looking for a fight."],
["maya",3,"MAY-006","Then why were you following me?"],
["eli",3,"ELI-002","I was following the radio. You happened to be walking toward it."],
["maya",3,"MAY-007","The emergency broadcast? That recording is a year old."],
["eli",3,"ELI-003","It played again last night."],
["maya",3,"MAY-008","That is impossible."],
["eli",3,"ELI-004","So is a town where every light works and nobody lives."],
["maya",3,"MAY-009","My sister disappeared here. I am finding out what happened."],
["eli",3,"ELI-005","Then we want the same thing. Answers."],
["eli",3,"ELI-006","The station door is chained, but the side window is broken."],

["eli",4,"ELI-007","Someone cleared this place out in a hurry."],
["maya",4,"MAY-010","No. They took the files and left the family pictures. They knew what mattered."],
["grant",4,"GRA-001","Field log, Grant Mercer. The evacuation siren started without power."],
["grant",4,"GRA-002","Cross ordered us to block the north road. Then we heard people inside the woods."],
["grant",4,"GRA-003","They sounded like our families."],
["grant",4,"GRA-004","Theo followed his mother's voice. I could not stop him."],
["eli",4,"ELI-008","The broadcast did not warn them. It pulled them out."],
["maya",4,"MAY-011","Samira's name is on this list."],
["eli",4,"ELI-009","So is the clinic. Maybe they treated someone who came back."],
["maya",4,"MAY-012","Then we go there next."],
["sheriff",4,"SHR-005","Mercer, if you hear this, burn the map. Do not let it learn another route."],
["eli",4,"ELI-010","It learns?"],

["maya",5,"MAY-013","This place still smells like disinfectant."],
["eli",5,"ELI-011","The generator is warm. Someone has been here."],
["chen",5,"DRC-001","Patient Ruth Bell arrived at one forty-two with no visible injuries."],
["chen",5,"DRC-002","She repeated a voice she heard beneath the town, word for word."],
["chen",5,"DRC-003","When I asked who was speaking, she answered in my voice."],
["chen",5,"DRC-004","I have locked the tunnel key in the church radio cabinet."],
["maya",5,"MAY-014","The tunnels are real."],
["eli",5,"ELI-012","And the church has a key to them."],
["maya",5,"MAY-015","We are not going underground."],
["eli",5,"ELI-013","I did not say we were. But somebody wants us to know the way in."],
["maya",5,"MAY-016","Samira's medical file is missing."],

["ruth",6,"RUT-001","Maya, your sister came by asking about the church basement."],
["ruth",6,"RUT-002","I told her the sheriff sealed it, but she already had a map."],
["ruth",6,"RUT-003","If you find this, please tell Samira I am sorry."],
["maya",6,"MAY-017","Ruth knew she was coming here."],
["eli",6,"ELI-014","Samira was ahead of the evacuation story. She was investigating it."],
["samira",6,"SAM-003","Maya, the signal is strongest near North Woods."],
["samira",6,"SAM-004","I left a copy of everything at the church. Do not trust a voice you cannot see."],
["maya",6,"MAY-018","She knew I would follow."],
["eli",6,"ELI-015","She also left you a way to survive it."],
["theo",6,"THE-001","Radio check. My name is Theo Marsh."],
["theo",6,"THE-002","I am at the north trail marker. Someone is calling from beyond the fence."],
["theo",6,"THE-003","It sounds like my mother, but she has been dead for three years."],
["theo",6,"THE-004","If I stop talking, do not answer when it uses me."],
["eli",6,"ELI-016","That transmission was why I came here."],
["maya",6,"MAY-019","You knew Theo?"],
["eli",6,"ELI-017","He was my friend. He sent that message directly to me."],
["maya",6,"MAY-020","Then we both have someone waiting in those woods."],
["eli",6,"ELI-018","Or something waiting with their voices."],

["eli",7,"ELI-019","From here on, we whisper."],
["maya",7,"MAY-021","I can hear Samira."],
["eli",7,"ELI-020","You can hear something that studied her."],
["samira",7,"SAM-005","Maya, I am cold. Please come closer."],
["maya",7,"MAY-022","That is not her."],
["eli",7,"ELI-021","Do not answer it."],
["maya",7,"MAY-023","The recorder is inside the shelter."],
["eli",7,"ELI-022","I will draw it away. Get the recorder and meet me at the fence."],
["maya",7,"MAY-024","We stay together."],
["eli",7,"ELI-023","Then move when I move."],
["sheriff",7,"SHR-006","Maya. Eli. The church is safe."],
["eli",7,"ELI-024","It knows both our names now. Run."],

["maya",8,"MAY-025","This is Samira's handwriting. She found the source under the town."],
["eli",8,"ELI-025","The signal is live. It has been live the whole time."],
["sheriff",8,"SHR-007","If anyone finds this, the missing people were taken below. Seal the door and leave Saint Hollow."],
["maya",8,"MAY-026","Samira might still be alive."],
["eli",8,"ELI-026","And Theo might be down there with her."],
["maya",8,"MAY-027","We came for answers. Now we know where to look."],
["eli",8,"ELI-027","Maya, the radio is receiving something."],
["samira",8,"SAM-006","Maya? If that is really you, do not open the door."],
["maya",8,"MAY-028","Samira?"],
["eli",8,"ELI-028","Look at the floor."],
["maya",8,"MAY-029","Something is underneath us."]
];

let currentRole = null;
let selectedActor = "maya";
let changedLines = new Set();

const loginScreen = document.getElementById("loginScreen");
const portal = document.getElementById("portal");
const sidebar = document.getElementById("sidebar");
const scriptContainer = document.getElementById("scriptContainer");
const codeInput = document.getElementById("codeInput");
const loginError = document.getElementById("loginError");
const saveButton = document.getElementById("saveButton");

function escapeHTML(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

function getOverrides(){
  return JSON.parse(localStorage.getItem("nocbLineEdits") || "{}");
}

function getLineText(line){
  const overrides = getOverrides();
  return overrides[line[2]] ?? line[3];
}

document.getElementById("loginForm").addEventListener("submit",event=>{
  event.preventDefault();
  const code = codeInput.value.replace(/\D/g,"");

  if(code === ownerCode){
    currentRole = "owner";
    selectedActor = "maya";
    openPortal();
    return;
  }

  const actor = Object.entries(characters).find(
    ([,details]) => details.code === code
  );

  if(!actor){
    loginError.textContent =
      "That code was not recognized. Check the number and try again.";
    return;
  }

  currentRole = actor[0];
  selectedActor = actor[0];
  openPortal();
});

codeInput.addEventListener("input",()=>{
  codeInput.value = codeInput.value.replace(/\D/g,"");
  loginError.textContent = "";
});

function openPortal(){
  loginScreen.classList.add("hidden");
  portal.classList.remove("hidden");

  const owner = currentRole === "owner";
  const badge = document.getElementById("accessBadge");

  badge.textContent = owner ? "OWNER ACCESS" : "ACTOR ACCESS";
  badge.classList.toggle("owner-badge",owner);
  saveButton.classList.toggle("hidden",!owner);

  renderSidebar();
  renderScript();
}

function renderSidebar(){
  if(currentRole !== "owner"){
    sidebar.innerHTML = "";
    sidebar.classList.add("hidden");
    document.querySelector(".dashboard").style.gridTemplateColumns = "1fr";
    return;
  }

  sidebar.classList.remove("hidden");
  document.querySelector(".dashboard").style.gridTemplateColumns = "";

  let html = '<p class="sidebar-title">CHARACTERS</p>';

  Object.entries(characters).forEach(([id,character],index)=>{
    const count = lines.filter(line=>line[0] === id).length;

    html += `
      <button
        class="actor-button ${selectedActor === id ? "active" : ""}"
        data-actor="${id}"
      >
        <span class="actor-number">0${index + 1}</span>
        <strong>${escapeHTML(character.name)}</strong>
        <span class="actor-count">${count}</span>
      </button>
    `;
  });

  sidebar.innerHTML = html;

  document.querySelectorAll(".actor-button").forEach(button=>{
    button.addEventListener("click",()=>{
      selectedActor = button.dataset.actor;
      renderSidebar();
      renderScript();
    });
  });
}

function renderScript(){
  const actorId = currentRole === "owner" ? selectedActor : currentRole;
  const actor = characters[actorId];
  const actorLines = lines.filter(line=>line[0] === actorId);
  const sceneNumbers = [...new Set(actorLines.map(line=>line[1]))];

  document.getElementById("viewType").textContent =
    currentRole === "owner" ? "OWNER SCRIPT VIEW" : "YOUR ASSIGNED ROLE";

  document.getElementById("characterHeading").textContent =
    `Here are ${actor.name}'s lines`;

  document.getElementById("lineSummary").textContent =
    `${actorLines.length} dialogue lines across ${sceneNumbers.length} scenes`;

  let html = "";

  sceneNumbers.forEach(sceneNumber=>{
    const sceneLines = actorLines.filter(line=>line[1] === sceneNumber);
    const scene = scenes[sceneNumber];

    html += `
      <section class="scene">
        <div class="scene-heading">
          <div class="scene-number">${String(sceneNumber).padStart(2,"0")}</div>
          <div>
            <small>SCENE ${sceneNumber}</small>
            <h3>${escapeHTML(scene[0])}</h3>
          </div>
        </div>
    `;

    sceneLines.forEach(line=>{
      const lineText = getLineText(line);
      const editable = currentRole === "owner";

      html += `
        <article class="line-card ${changedLines.has(line[2]) ? "changed" : ""}">
          <div class="line-id">
            <span>${line[2]}</span>
            <span>SCENE ${line[1]}</span>
          </div>

          ${
            editable
              ? `<textarea
                   class="line-editor"
                   data-line-id="${line[2]}"
                 >${escapeHTML(lineText)}</textarea>`
              : `<p class="line-text">${escapeHTML(lineText)}</p>`
          }

          <p class="location">
            ${escapeHTML(scene[0])} • ${escapeHTML(scene[1])}
          </p>
        </article>
      `;
    });

    html += "</section>";
  });

  scriptContainer.innerHTML = html;

  document.querySelectorAll(".line-editor").forEach(editor=>{
    editor.addEventListener("input",()=>{
      changedLines.add(editor.dataset.lineId);
      editor.closest(".line-card").classList.add("changed");
      saveButton.textContent = `Save ${changedLines.size} change${changedLines.size === 1 ? "" : "s"}`;
      document.getElementById("savedMessage").textContent = "";
    });
  });

  saveButton.textContent =
    changedLines.size
      ? `Save ${changedLines.size} change${changedLines.size === 1 ? "" : "s"}`
      : "Save changes";
}

saveButton.addEventListener("click",()=>{
  const overrides = getOverrides();

  document.querySelectorAll(".line-editor").forEach(editor=>{
    if(changedLines.has(editor.dataset.lineId)){
      overrides[editor.dataset.lineId] = editor.value.trim();
    }
  });

  localStorage.setItem("nocbLineEdits",JSON.stringify(overrides));
  changedLines.clear();

  document.getElementById("savedMessage").textContent =
    "All script changes were saved.";

  renderScript();
});

document.getElementById("logoutButton").addEventListener("click",()=>{
  currentRole = null;
  selectedActor = "maya";
  changedLines.clear();
  codeInput.value = "";
  portal.classList.add("hidden");
  loginScreen.classList.remove("hidden");
});
</script>
